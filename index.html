<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de MDP</title>
    <link rel="stylesheet" href="style/style_generator.css">
</head>
<body>
    <header>
        <h1>YOUR PASSWORD GENERATOR</h1>
    </header>
    <main>
        <div class="container">
            <div id="password-strength">
                Strength :<span id="strength-text">weak</span>
                <div id="strength-bar">
                    <div id="strength-indicator"></div>
                </div>
            </div>
            <input id="nouveauPassword" readonly placeholder="Your password will display here...">
            <button onclick="copy()">Copy the password</button>
        </div>              
        <div class="container-setting">
            <div class="setting-group">
                <label for="lenght-password-label"><span id="lenght-password">Password length: characters</span>
                <input type="range" id="lenght-password-value" name="lenght-password-value" min="10" max="30" value="14" oninput="updateSliderValue(this.value)">
                </label>
            </div>
            <div class="setting-group">
                <div>
                    <input type="checkbox" id="min">
                    <label for="min">Lowercase</label>
                </div>
                <div>
                    <input type="checkbox" id="maj">
                    <label for="maj">Uppercase</label>
                </div>
            </div>
            <div class="setting-group">
                <div>
                    <input type="checkbox" id="chiffre">
                    <label for="chiffre">Number</label>
                </div>
                <div>
                    <input type="checkbox" id="symbole">
                    <label for="symbole">Symbol</label>
                </div>
            </div>
            <div class="button-group">
                <button onclick="generatePassword()">Generate Password</button>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2022 - Th1sma</p>
    </footer>
    <script src="/js/script_generateur.js"></script>
</body>
</html>
