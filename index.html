<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de MDP</title>
    <link rel="stylesheet" href="style/style_generator.css">
    <link rel="icon" type="image/png" href="./image/fav_icon.png">
</head>
<body>
    <header>
        <h1>Générer votre mot de passe sécurisé</h1>
    </header>
    <main>
        <div class="container">
            <input id="nouveauPassword" readonly placeholder="Votre mot de passe ici">
            <button onclick="generateur()">Nouveau MDP</button>
        </div>
        <div class="container-setting">
            <div class="setting-group">
                <label for="taille">N° de lettre</label>
                <input type="range" id="taille" name="seuil" min="10" max="25">
            </div>
            <div class="setting-group">
                <div>
                    <input type="checkbox" id="min">
                    <label for="min">Lettre minuscule</label>
                </div>
                <div>
                    <input type="checkbox" id="maj">
                    <label for="maj">Lettre majuscule</label>
                </div>
            </div>
            <div class="setting-group">
                <div>
                    <input type="checkbox" id="chiffre">
                    <label for="chiffre">Chiffre</label>
                </div>
                <div>
                    <input type="checkbox" id="symbole">
                    <label for="symbole">Symbole</label>
                </div>
            </div>
            <div class="button-group">
                <button onclick="parDefaut()">Génération automatique</button>
                <button onclick="copie()">Copier le mot de passe</button>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2022 Thisma17</p>
    </footer>
    <script src="/js/script_generateur.js"></script>
</body>
</html>
